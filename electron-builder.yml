appId: com.lyriclens.app
productName: Lyric Lens
copyright: Copyright © Lyric Lens contributors
directories:
  output: release
  buildResources: resources
files:
  - out/**
  - package.json
extraResources:
  - from: resources/trayTemplate.png
    to: trayTemplate.png
  - from: resources/trayTemplate@2x.png
    to: trayTemplate@2x.png
mac:
  category: public.app-category.music
  icon: resources/icon.png
  target:
    - target: dmg
      arch: [arm64, x64]
    - target: zip
      arch: [arm64, x64]
  # Menu-bar app: no Dock icon.
  extendInfo:
    LSUIElement: true
  hardenedRuntime: true
  gatekeeperAssess: false
win:
  icon: resources/icon.png
  target: nsis
